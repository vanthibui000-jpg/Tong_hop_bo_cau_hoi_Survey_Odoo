<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[GDH] Khảo Sát Odoo 19</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section id="home-screen">
            <header>
                <h1 class="main-title">[GDH] Khảo Sát Odoo 19</h1>
                <div class="part-label">Chọn mảng kiểm tra</div>
            </header>
            <h2 class="section-title">Danh sách mảng</h2>
            <section id="category-list" class="category-list"></section>
        </section>

        <section id="quiz-screen" class="hidden">
            <header>
                <h1 class="main-title">[GDH] Khảo Sát Odoo 19</h1>
                <div id="quiz-category" class="part-label"></div>
            </header>

            <h2 class="section-title">Phần kiểm tra</h2>
            <section id="quiz-container"></section>

            <div class="navigation">
                <button id="prev-btn" onclick="previousQuestion()">← Câu trước</button>
                <span id="question-number"></span>
                <button id="next-btn" onclick="nextQuestion()">Câu tiếp →</button>
            </div>

            <div class="submit-area">
                <button id="submit-btn" onclick="submitQuiz()">Nộp bài</button>
            </div>

            <div id="result-box" class="result-box"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
